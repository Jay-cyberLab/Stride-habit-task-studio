<!doctype html>
<html lang="en" data-theme="classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stride — Habit & Task Studio</title>
    <meta
      name="description"
      content="Daily habit tracker with goal progress, streak analytics, and a categorized, priority-tagged task planner."
    />
    <meta property="og:title" content="Stride — Habit & Task Studio" />
    <meta
      property="og:description"
      content="Daily habit tracker with goal progress, streak analytics, and a categorized, priority-tagged task planner."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cadence_theme_v1');
          if (t === 'classic' || t === 'ocean' || t === 'nature' || t === 'royal') {
            document.documentElement.setAttribute('data-theme', t);
          }
          var m = localStorage.getItem('cadence_color_mode_v1');
          var dark =
            m === 'dark' ||
            (m !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-color-mode', 'dark');
          } else {
            document.documentElement.setAttribute('data-color-mode', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
